name: "Ошибка в проекте"
description: "Сообщить о проблеме в сайте, форуме, Wiki или запуске"
title: "[Ошибка] "
body:
  - type: dropdown
    id: component
    attributes:
      label: "Где возникла проблема?"
      options:
        - "Основной сайт"
        - "Форум"
        - "Wiki"
        - "Общий запуск / установка"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Как воспроизвести?"
      description: "Опишите последовательность действий."
      placeholder: "1. Открыть ...
2. Нажать ...
3. Появляется ошибка ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемый результат"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Фактический результат"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Окружение и дополнительные сведения"
      description: "Windows/Linux, Python, браузер, лог ошибки без секретов."
  - type: checkboxes
    id: checks
    attributes:
      label: "Перед публикацией"
      options:
        - label: "Я проверил(а) существующие Issues."
          required: true
        - label: "В описании нет паролей, токенов, cookies, баз данных и личных сведений."
          required: true
